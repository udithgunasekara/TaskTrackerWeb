version: '3.8'

services:
  db:
    image: mysql:8
    container_name: tasktracker-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tasktracker
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
    networks:
      - tasktracker-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: tasktracker-backend
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/tasktracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      APP_JWT_SECRET: MjAxNTUwYTZjNWE5YzQxYjg4Y2FhY2ZhOGNiNGU5MWIyZDkyMWIwZWJjN2QyNWI5ZDQwNjA4NDIyNDQ2MGZjMA==
      APP_JWT_EXPIRATION_MS: 86400000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tasktracker-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: tasktracker-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tasktracker-network

volumes:
  db_data:

networks:
  tasktracker-network:
    driver: bridge
